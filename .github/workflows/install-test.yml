# Prompt — follows INSTALL.md on clean Windows, macOS and Linux machines with a published release:
# install Python the way the guide says, download the release, install, start Prompt, take a screenshot.
# Run by hand: Actions › Install test › Run workflow (choose a version tag).
name: Install test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v2.0.1), or "main" to pack and test the current code
        required: true
        default: main

permissions:
  contents: read

jobs:
  pack:
    name: Get the downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: inputs.tag == 'main'
        with:
          node-version: 22
      - name: Pack the current code
        if: inputs.tag == 'main'
        run: npm run build && bash scripts/pack.sh main
      - name: Download the release
        if: inputs.tag != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir files && gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" -D files
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: files/*

  linux:
    name: Linux (Ubuntu) as in INSTALL.md
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Python with Tk (sudo apt install python3 python3-tk)"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3 python3-tk xvfb imagemagick x11-utils
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: dl
      - name: "Step 2: download, unpack, ./install.sh"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~
          cp "$GITHUB_WORKSPACE"/dl/Prompt-*-linux.tar.gz .
          tar xzf Prompt-*-linux.tar.gz
          cd prompt
          ./install.sh
      - name: "Step 3: start Prompt (prompt-app) and take a screenshot"
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 & sleep 2
          ~/.local/bin/prompt-app --market > ~/prompt.log 2>&1 &
          sleep 10
          pgrep -f "prompt.pyw" > /dev/null || { cat ~/prompt.log; exit 1; }
          xwininfo -root -tree | grep -q '"Prompt"' || { echo "no Prompt window"; exit 1; }
          import -window root linux.png
          cat ~/prompt.log
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: linux.png

  macos:
    name: macOS as in INSTALL.md
    needs: pack
    runs-on: macos-latest
    steps:
      - name: "Step 1: Python from python.org"
        run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -c 'import tkinter; print("Tk", tkinter.TkVersion)'
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: dl
      - name: "Step 2-3: download, unpack, run 'Install Prompt.command'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/Downloads
          cp "$GITHUB_WORKSPACE"/dl/Prompt-*-macos.zip .
          ditto -x -k Prompt-*-macos.zip .
          test -x "Prompt/Install Prompt.command"
          # Not started by the installer here, so the next step can start it with diagnostics on.
          PROMPT_NO_START=1 "./Prompt/Install Prompt.command" < /dev/null
      - name: "Step 4: open Prompt from ~/Applications and take a screenshot"
        run: |
          test -d ~/Applications/Prompt.app
          open --env PROMPT_DEBUG=1 ~/Applications/Prompt.app --args --market
          sleep 15
          D="$HOME/Library/Application Support/Prompt"
          cat "$D/debug.log" 2>/dev/null || true
          cat "$D/error.log" 2>/dev/null || true
          pgrep -f "prompt.pyw" > /dev/null || { echo "Prompt is not running"; exit 1; }
          grep -q "mapped=1" "$D/debug.log" || { echo "Prompt window is not on screen"; exit 1; }
          screencapture -x macos.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos
          path: macos.png

  windows:
    name: Windows as in INSTALL.md
    needs: pack
    runs-on: windows-latest
    steps:
      - name: "Step 1: Python (preinstalled on the runner, with tcl/tk)"
        run: python -c "import tkinter, sys; print(sys.version, 'Tk', tkinter.TkVersion)"
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: dl
      - name: "Step 2-5: download, extract, run 'Install Prompt.cmd'"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          cd $env:USERPROFILE
          Copy-Item "$env:GITHUB_WORKSPACE\dl\Prompt-*-windows.zip" .
          Expand-Archive (Get-Item Prompt-*-windows.zip) .
          cmd /c "`"$env:USERPROFILE\Prompt\Install Prompt.cmd`" < nul"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Prompt\bin\Prompt.exe")) { throw "Prompt.exe missing" }
      - name: "Step 6: start Prompt from the Start menu and take a screenshot"
        shell: pwsh
        run: |
          Start-Process "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Prompt.lnk"
          Start-Sleep -Seconds 12
          if (-not (Get-Process Prompt -ErrorAction SilentlyContinue)) { Get-Content "$env:LOCALAPPDATA\Programs\Prompt\error.log"; throw "Prompt is not running" }
          $n = @(Get-Process Prompt -ErrorAction SilentlyContinue).Count
          Write-Host "Prompt processes: $n"
          if ($n -ne 1) { throw "Expected one Prompt, found $n" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\windows.png")
          Get-Content "$env:LOCALAPPDATA\Programs\Prompt\error.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: windows.png
