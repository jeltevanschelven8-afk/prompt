# Prompt — packs the downloads for Windows, macOS and Linux and puts them under Releases.
# Runs automatically for a new version tag (e.g. v2.0.0), or by hand via Actions › Release › Run workflow
# (then it only builds, without a release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    name: Pack downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fresh marketplace catalogue
        run: npm run build
      - name: Pack Windows, macOS and Linux
        run: |
          V="${GITHUB_REF_NAME#v}"; case "$V" in [0-9]*) ;; *) V="dev";; esac
          bash scripts/pack.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: files/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: files
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --title "Prompt $GITHUB_REF_NAME" --notes-file .github/release-notes.md
