# Prompt — packs the downloads for Windows, macOS and Linux and puts them under Releases.
# Runs automatically for a new version tag (e.g. v2.0.0), or by hand via Actions › Release › Run workflow
# (then it only builds, without a release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    name: Pack downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fresh marketplace catalogue
        run: npm run build
      - name: Pack Windows, macOS and Linux
        run: |
          V="${GITHUB_REF_NAME#v}"; case "$V" in [0-9]*) ;; *) V="dev";; esac
          APP_FILES="prompt.pyw builtin_commands.json uitleg.json synonyms.json registry.json catalog-index.json icon.ico icon.png README.md"
          pack() {  # $1 = folder name
            mkdir -p "out/$1/app"
            for f in $APP_FILES; do cp "app/$f" "out/$1/app/"; done
            cp -r skills "out/$1/skills"
            cp README.md INSTALL.md LICENSE "out/$1/"
          }

          pack windows/Prompt
          cp -r app/host app/install.ps1 app/install.cmd app/make_shortcuts.ps1 out/windows/Prompt/app/
          printf '@echo off\r\ncall "%%~dp0app\\install.cmd"\r\n' > "out/windows/Prompt/Install Prompt.cmd"

          pack macos/Prompt
          cp app/install.sh app/uninstall.sh out/macos/Prompt/app/
          printf '#!/bin/bash\ncd "$(dirname "$0")" && bash app/install.sh\necho\nread -n 1 -s -r -p "Press any key to close this window."\n' > "out/macos/Prompt/Install Prompt.command"
          chmod +x out/macos/Prompt/app/*.sh "out/macos/Prompt/Install Prompt.command"

          pack linux/prompt
          cp app/install.sh app/uninstall.sh out/linux/prompt/app/
          printf '#!/bin/bash\ncd "$(dirname "$0")" && exec bash app/install.sh\n' > out/linux/prompt/install.sh
          chmod +x out/linux/prompt/app/*.sh out/linux/prompt/install.sh

          mkdir -p files
          (cd out/windows && zip -qrX "../../files/Prompt-$V-windows.zip" Prompt)
          (cd out/macos && zip -qrX "../../files/Prompt-$V-macos.zip" Prompt)
          (cd out/linux && tar czf "../../files/Prompt-$V-linux.tar.gz" prompt)
          ls -la files
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: files/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: files
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --title "Prompt $GITHUB_REF_NAME" --notes-file .github/release-notes.md
