# Temporary: find which Tk feature crashes Tk 9 on macOS.
name: Tk diagnose

on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: main

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.14.8/python-3.14.8-macos11.pkg
          sudo installer -pkg python.pkg -target /
      - name: Where does the start-up time go?
        run: |
          PY=/Library/Frameworks/Python.framework/Versions/3.14/bin/python3
          mkdir -p /tmp/h/.claude/skills/demo
          printf -- '---\nname: demo\ndescription: Demo skill. Use when testing.\n---\n\n# Demo\n' > /tmp/h/.claude/skills/demo/SKILL.md
          cat > prof.py <<'EOF'
          import cProfile, pstats, time, sys, tkinter as tk
          import importlib.machinery, importlib.util
          l = importlib.machinery.SourceFileLoader("p", "app/prompt.pyw"); sp = importlib.util.spec_from_loader("p", l)
          m = importlib.util.module_from_spec(sp); l.exec_module(m)
          m.find_claude_app = lambda: None
          root = tk.Tk()
          t = time.time(); pr = cProfile.Profile(); pr.enable()
          app = m.App(root)
          pr.disable(); print(f"App() took {time.time() - t:.2f}s")
          pstats.Stats(pr).sort_stats("cumulative").print_stats(18)
          pr2 = cProfile.Profile()
          for i in range(12):
              t = time.time(); pr2.enable(); root.update(); pr2.disable()
              print(f"update {i}: {time.time() - t:.2f}s")
          pstats.Stats(pr2).sort_stats("tottime").print_stats(15)
          pstats.Stats(pr2).sort_stats("ncalls").print_stats(8)
          EOF
          HOME=/tmp/h $PY prof.py 2>&1 | grep -vE "^\s*$" | cut -c1-160 | head -120
