# Temporary: find which Tk calls make the first draw slow on macOS.
name: Tk diagnose

on:
  workflow_dispatch:
    inputs:
      tag:
        required: false
        default: main

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          curl -sSLo python.pkg https://www.python.org/ftp/python/3.14.8/python-3.14.8-macos11.pkg
          sudo installer -pkg python.pkg -target /
      - name: Bisect (Tk 9)
        run: |
          mkdir -p /tmp/h/.claude/skills/demo
          printf -- '---\nname: demo\ndescription: Demo skill. Use when testing.\n---\n\n# Demo\n' > /tmp/h/.claude/skills/demo/SKILL.md
          for V in nowidth noregion "nowidth noregion" "nowrap nowidth"; do
            VARIANT="$V" HOME=/tmp/h /Library/Frameworks/Python.framework/Versions/3.14/bin/python3 scripts/tk-bisect.py 2>&1 | tail -5
          done
