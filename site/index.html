<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt</title>
  <meta name="description" content="Open-source marktplaats voor Claude Code-skills: zoeken, installeren, als prompt kopiëren en publiceren.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23b8441f'/%3E%3Cpath d='M19.5 8 12.5 24' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const th = localStorage.getItem('prompt.theme'); if (th) document.documentElement.dataset.theme = th; } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Naar inhoud</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Prompt">
        <span class="keycap" aria-hidden="true">/</span><span class="brand-word">prompt</span>
      </a>
      <nav class="nav" aria-label="Hoofdmenu">
        <a href="#/" data-nav="discover" data-i18n="nav.discover">Ontdekken</a>
        <a href="#/mine" data-nav="mine"><span data-i18n="nav.mine">Mijn skills</span> <span class="count-pill" id="mine-count" hidden>0</span></a>
        <a href="#/publish" data-nav="publish" data-i18n="nav.publish">Publiceren</a>
        <a href="#/about" data-nav="about" data-i18n="nav.about">Hoe het werkt</a>
      </nav>
      <div class="top-actions">
        <button class="icon-btn lang-btn" id="lang-btn" type="button">EN</button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Thema wisselen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="icon-btn" id="gh-link" href="https://github.com" target="_blank" rel="noopener" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <span><span class="keycap keycap-sm" aria-hidden="true">/</span> <span data-i18n="footer.text">Prompt is open source (MIT).</span></span>
      <a id="footer-gh" href="https://github.com" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
